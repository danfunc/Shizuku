# --- console over USB CDC ACM (results are read from the host) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PID=0x0005
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Zephyr IPC bench"

# --- what is under test ---
CONFIG_ARM_MPU=y
CONFIG_USERSPACE=y
CONFIG_FPU=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# --- speed first, no checks on the measured path ---
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_ASSERT=n
CONFIG_LOG=n
CONFIG_STACK_SENTINEL=n
CONFIG_INIT_STACKS=n
CONFIG_THREAD_NAME=n
CONFIG_TIMESLICING=n
CONFIG_BOOT_BANNER=n
CONFIG_THREAD_MONITOR=n
CONFIG_STACK_USAGE=n
CONFIG_DEBUG=n
CONFIG_NO_OPTIMIZATIONS=n

# --- thread / queue sizing for the sweeps ---
CONFIG_NUM_PREEMPT_PRIORITIES=30
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_PICOLIBC=y

# app-defined syscalls (bench_stamp / bench_nop): scans the app source dir
CONFIG_APPLICATION_DEFINED_SYSCALL=y
CONFIG_MAX_THREAD_BYTES=12
CONFIG_CRC=y
